<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>taiwei</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f3f5f7; color: #17202a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(860px, 100%); min-height: 100vh; margin: auto; display: grid; grid-template-rows: auto 1fr auto; background: #fff; box-shadow: 0 0 28px #1d2b3820; }
    header { padding: 18px 24px; border-bottom: 1px solid #e7ebef; font-size: 18px; font-weight: 700; }
    header span { color: #697783; font-size: 13px; font-weight: 400; margin-left: 8px; }
    #messages { overflow-y: auto; padding: 26px max(20px, 5vw); display: flex; flex-direction: column; gap: 14px; }
    .message { max-width: 82%; padding: 11px 14px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; color: #fff; background: #2563eb; border-bottom-right-radius: 5px; }
    .assistant { align-self: flex-start; background: #edf1f4; border-bottom-left-radius: 5px; }
    .activity { align-self: flex-start; color: #687783; font: 12px ui-monospace, monospace; padding: 2px 7px; }
    form { border-top: 1px solid #e7ebef; padding: 16px; display: flex; align-items: flex-end; gap: 10px; }
    textarea { flex: 1; resize: none; min-height: 46px; max-height: 150px; border: 1px solid #ccd4dc; border-radius: 12px; padding: 12px; font: inherit; outline: none; }
    textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #2563eb1d; }
    button { border: 0; border-radius: 10px; padding: 12px 17px; color: #fff; background: #2563eb; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    #stop { background: #d04444; }
    @media (max-width: 600px) { main { box-shadow: none; } .message { max-width: 92%; } form { padding: 10px; } }
  </style>
</head>
<body>
  <main>
    <header>taiwei <span>local agent</span></header>
    <section id="messages" aria-live="polite"></section>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Message taiwei…" autofocus></textarea>
      <button id="send" type="submit">Send</button>
      <button id="stop" type="button" disabled>Stop</button>
    </form>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
