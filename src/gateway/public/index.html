<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="taiwei local AI agent chat">
  <title>taiwei · 本地 AI 助手</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section class="login-screen" id="login-screen">
    <form class="login-card" id="login-form">
      <div class="login-mark">🦞</div>
      <h1>登录 taiwei</h1>
      <p>请输入网关账号以继续。</p>
      <label for="login-username">用户名</label>
      <input id="login-username" name="username" autocomplete="username" required>
      <label for="login-password">密码</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      <div class="login-error" id="login-error" role="alert"></div>
      <button class="login-button" id="login-submit" type="submit">登录</button>
    </form>
  </section>
  <div class="app-shell" id="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <a class="brand" href="#" aria-label="taiwei 首页"><span class="brand-mark">🦞</span><span class="brand-name">taiwei</span></a>
        <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="关闭侧边栏">×</button>
      </div>
      <button class="new-chat sidebar-new" type="button"><span>+</span><span class="sidebar-label">新对话</span></button>
      <div class="history-heading"><span>历史会话</span><span id="session-count">0</span></div>
      <nav class="session-list" id="session-list" aria-label="历史会话"></nav>
      <div class="sidebar-footer">
        <div class="local-status"><span class="local-dot"></span><span class="sidebar-label">本地安全运行</span></div>
        <button class="logout-button" id="logout" type="button" title="退出登录" hidden><span>⇥</span><span class="sidebar-label">退出</span></button>
      </div>
    </aside>
    <div class="mobile-scrim" id="mobile-scrim"></div>

    <main class="main-panel">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button" id="sidebar-toggle" type="button" aria-label="切换侧边栏">☰</button>
          <div class="title-block">
            <h1 id="session-title">新会话</h1>
            <div class="topbar-meta">
              <span class="status-pill idle" id="status-pill"><i></i><span>就绪</span></span>
              <span class="model-name" id="model-name">OpenAI compatible</span>
            </div>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="theme-toggle" type="button" aria-label="切换主题">☾</button>
          <button class="new-chat compact-new" type="button"><span>+</span><span>新对话</span></button>
        </div>
      </header>

      <section class="chat-scroll" id="chat-scroll" aria-live="polite">
        <div class="messages" id="messages"></div>
        <div class="welcome" id="welcome">
          <div class="welcome-mark">🦞</div>
          <h2>你好，我是 taiwei</h2>
          <p>你的本地主动式 AI 助手。写代码、理思路、做研究，我们从这里开始。</p>
          <div class="prompt-grid">
            <button class="prompt-chip" type="button" data-prompt="帮我梳理这个项目的架构">
              <span>⌘</span><strong>梳理项目架构</strong><small>快速理解代码库</small>
            </button>
            <button class="prompt-chip" type="button" data-prompt="检查当前代码中可能的问题">
              <span>◇</span><strong>检查代码问题</strong><small>发现风险与改进点</small>
            </button>
            <button class="prompt-chip" type="button" data-prompt="为我制定一个清晰的实现计划">
              <span>✦</span><strong>制定实现计划</strong><small>把想法拆成可执行步骤</small>
            </button>
            <button class="prompt-chip" type="button" data-prompt="总结我的当前工作并给出下一步建议">
              <span>↗</span><strong>规划下一步</strong><small>聚焦最有价值的事</small>
            </button>
          </div>
        </div>
      </section>

      <button class="scroll-bottom" id="scroll-bottom" type="button">↓ 回到底部</button>

      <div class="composer-dock">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" maxlength="20000" placeholder="给 taiwei 发消息…" aria-label="消息"></textarea>
          <div class="composer-footer">
            <span class="composer-hint">Enter 发送 · Shift + Enter 换行</span>
            <button class="send-button" id="send" type="submit" aria-label="发送">↑</button>
            <button class="stop-button" id="stop" type="button" aria-label="停止"><span></span> 停止</button>
          </div>
        </form>
        <p class="disclaimer">taiwei 可能会犯错。重要信息请仔细核对。</p>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
